services:
  mysql:
    image: mysql:8.0
    container_name: ai_gateway_mysql
    environment:
      MYSQL_ROOT_PASSWORD: root123
      MYSQL_DATABASE: ai_gateway
    ports:
      - "3306:3306"
    volumes:
      - ./server/migrations:/docker-entrypoint-initdb.d
      - mysql_data:/var/lib/mysql
    command: --default-authentication-plugin=mysql_native_password
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot123"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: ai_gateway_redis
    ports:
      - "6391:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  server:
    build: ./server
    container_name: ai_gateway_server
    ports:
      - "8080:8080"
    environment:
      DB_DSN: root:root123@tcp(mysql:3306)/ai_gateway?charset=utf8mb4&parseTime=True&loc=Local
      REDIS_ADDR: redis:6379
      SERVER_PORT: "8080"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy

  web:
    build: ./web
    container_name: ai_gateway_web
    ports:
      - "3000:80"
    depends_on:
      - server

volumes:
  mysql_data:
