# 企业大模型公共服务平台 (AI Gateway Console)
# 服务配置文件

server:
  port: 8080
  mode: debug   # debug | release | test

database:
  host: 127.0.0.1
  port: 3306
  user: root
  password: root123
  dbname: ai_gateway
  charset: utf8mb4
  # DSN 可通过环境变量 DB_DSN 覆盖

redis:
  addr: 127.0.0.1:6391
  password: ""
  db: 0
  # 地址可通过环境变量 REDIS_ADDR 覆盖

jwt:
  secret: "ai-gateway-jwt-secret-key-change-in-production"
  access_token_ttl: 24h
  refresh_token_ttl: 168h    # 7 days

quota:
  default_daily_tokens: 1000000  # 每个 API Key 默认日 Token 配额上限

simulator:
  min_interval: 3s   # 模拟调用最小间隔
  max_interval: 6s   # 模拟调用最大间隔
  enabled: true      # 是否启用模拟器
